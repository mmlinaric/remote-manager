name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb xauth
      - name: Run tests
        run: xvfb-run --auto-servernum ./mvnw --batch-mode test
